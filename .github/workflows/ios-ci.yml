name: iOS CI

on:
  pull_request:
    branches:
      - feature/integrate-ci-cd
      - main
  workflow_dispatch:

# A newer push to the same PR makes the in-flight build obsolete.
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      # Keeps the 18k-line xcodebuild output down to warnings and errors.
      NSUnbufferedIO: YES

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: TypeScript check
        run: yarn typecheck

      - name: Run ESLint
        run: yarn lint

      - name: Run unit tests
        run: yarn test --ci

      # Resolves CocoaPods from the Gemfile's constraints under .ruby-version,
      # rather than whatever version ships on the runner image. There is no
      # committed Gemfile.lock -- the old one was resolved under Ruby 2.6 with
      # Bundler 1.17.2, which calls String#untaint (removed in Ruby 3.2).
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler: latest
          bundler-cache: true

      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        working-directory: ios
        run: bundle exec pod install

      # Bust this by bumping the `v1` segment if a stale build ever confuses CI.
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ios/build/DerivedData
          key: ${{ runner.os }}-derived-v1-${{ hashFiles('ios/Podfile.lock', 'yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-derived-v1-

      - name: Build iOS
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace RNTemplate.xcworkspace \
            -scheme RNTemplate \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/build/DerivedData/Logs
          if-no-files-found: ignore
          retention-days: 7
