name: iOS CI

on:
  pull_request:
    branches:
      - feature/integrate-ci-cd
      - main
  workflow_dispatch:

# A newer push to the same PR makes the in-flight build obsolete.
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      # Keeps the 18k-line xcodebuild output down to warnings and errors.
      NSUnbufferedIO: YES

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GoogleService-Info.plist is gitignored but is a build input in the
      # Resources phase, so Xcode fails without it. Restored from a secret
      # here (early) so a missing secret fails fast, not 14 minutes in.
      - name: Restore Firebase config
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "::error::Secret GOOGLE_SERVICE_INFO_PLIST is not set."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/GoogleService-Info.plist
          plutil -lint ios/GoogleService-Info.plist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: TypeScript check
        run: yarn typecheck

      - name: Run ESLint
        run: yarn lint

      - name: Run unit tests
        run: yarn test --ci

      # Resolves CocoaPods from the Gemfile's constraints under .ruby-version,
      # rather than whatever version ships on the runner image. There is no
      # committed Gemfile.lock -- the old one was resolved under Ruby 2.6 with
      # Bundler 1.17.2, which calls String#untaint (removed in Ruby 3.2).
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler: latest
          bundler-cache: true

      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        working-directory: ios
        run: bundle exec pod install

      # Bust this by bumping the `v1` segment if a stale build ever confuses CI.
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ios/build/DerivedData
          key: ${{ runner.os }}-derived-v1-${{ hashFiles('ios/Podfile.lock', 'yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-derived-v1-

      - name: Build iOS
        working-directory: ios
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -workspace RNTemplate.xcworkspace \
            -scheme RNTemplate \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/xcodebuild.log

      # xcodebuild only reports exit code 65 on failure; surface the real
      # message inline so it is readable without downloading an artifact.
      - name: Report build errors
        if: failure()
        working-directory: ios
        run: |
          echo "::group::error lines"
          grep -nE 'error:|error Command|Undefined symbol|ld: |BUILD FAILED|The following build commands failed' \
            build/xcodebuild.log | tail -n 60 || echo "(no error: lines matched)"
          echo "::endgroup::"
          echo "::group::last 150 lines"
          tail -n 150 build/xcodebuild.log
          echo "::endgroup::"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            ios/build/xcodebuild.log
            ios/build/DerivedData/Logs
          if-no-files-found: warn
          retention-days: 7
